name: sign

# The site matches single-pair runs by this name; keep the format unchanged.
run-name: "sign-all :: ${{ inputs.cert }} :: ${{ inputs.app }}"

# Signs the apps in sadboizx/SideInstaller's public/ipas.json (Feather,
# Ksign, ESign, YouTube) with every certificate in the NexCerts pool
# (cert-url.txt), using the Python signer in signer/ (Apple codesign on
# macOS) — PPQ Protection and the Feather/Ksign signing-assets embed
# included. One release per app (tag = app id) holding
# <app>-<slug>.ipa + <app>-<slug>.plist, plus pool.json on the `pool`
# release for the website's /api/pool.
#
# Runs on:
#   - workflow_dispatch: app (an app id, or all), cert (a pool slug for a
#     single pair, or empty for all), force (re-sign everything)
#   - a daily schedule, and any push that touches the pool or the signer.
# The check job runs on Linux and publishes status changes + pool.json;
# only when something needs signing does the macOS job start.
# The site dispatches this workflow for a single (app, cert) pair and
# matches runs by their run-name, so keep the run-name format unchanged.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "App id from public/ipas.json (feather, ksign, esign, youtube), or all"
        required: false
        default: "all"
        type: string
      cert:
        description: "Certificate slug from pool.json for a single pair, or empty for all"
        required: false
        default: ""
        type: string
      force:
        description: "Re-sign every certificate, not only new and changed ones"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "certs/**"
      - "cert-url.txt"
      - "signer/**"
      - ".github/workflows/sign.yml"

# One run at a time. Every run re-reads the releases and the pool, so a run
# that GitHub drops from the queue in favour of a newer one loses nothing.
concurrency:
  group: sign
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIGN_APP: ${{ inputs.app }}
  SIGN_CERT: ${{ inputs.cert }}
  SIGN_FORCE: ${{ inputs.force }}
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Check certificates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # publish status changes and pool.json
    outputs:
      sign: ${{ steps.sync.outputs.needs_signing }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sadboizx/SideInstaller
          path: main-repo
          persist-credentials: false
      - id: sync
        run: python3 -m signer sync --check-only

  sign:
    name: Sign new certificates
    needs: check
    if: needs.check.outputs.sign == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write   # create releases and upload the signed IPAs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sadboizx/SideInstaller
          path: main-repo
          persist-credentials: false
      - run: python3 -m signer sync
